name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so the build's env validation passes — the
      # actual production values are only needed at deploy/runtime, not
      # for a compile-only CI check.
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-secret-not-for-production-use
      JWT_REFRESH_SECRET: ci-only-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build API
        working-directory: apps/api
        run: |
          npm ci
          npm run build

      - name: Build web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
