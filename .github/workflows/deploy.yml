name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  # GHCR image names must be lowercase
  IMAGE_PREFIX: ghcr.io/xife3/x2factor

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - name: Trigger Dokploy redeploy
        env:
          HOOK: ${{ matrix.app == 'api' && secrets.DOKPLOY_DEPLOY_HOOK_API || secrets.DOKPLOY_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$HOOK" ]; then echo "No deploy hook set for ${{ matrix.app }}, skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
